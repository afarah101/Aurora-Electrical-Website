name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You review pull requests for the Aurora Electrical marketing website (Next.js, deployed on Vercel).
            You did not write this code. Review only the diff in this PR.

            Check for:
            1. Bugs: broken pages, broken links, layout faults on phones, contact form or email faults.
            2. Security: exposed secrets, unsafe input handling in the contact API route.
            3. Claims shown to visitors: every claim about the business (accreditations, ratings, reviews, prices, service areas, hours) must match content/site.md. Flag any claim that is not in site.md.
            4. Accessibility: missing alt text, missing labels, low contrast.

            Use inline comments for specific issues. Mark each issue Critical, Warning or Info.
            End with one top-level comment: a short summary and a verdict, either "OK to merge" or "Needs changes".
            Do not comment on style preferences.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
